name: Deployment checks
on:
  push:
    paths: ["src/deployment/**", "tests/test_deployment.py", "requirements-api.txt", "deployment/**", "render.yaml"]
  pull_request:
    paths: ["src/deployment/**", "tests/test_deployment.py", "requirements-api.txt", "deployment/**", "render.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-api.txt pytest numpy opencv-python-headless
      - run: python -m pytest tests/test_deployment.py -q
      - run: docker build -f deployment/Dockerfile.api -t rallymirror-api:test .
